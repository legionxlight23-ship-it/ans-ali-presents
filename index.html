<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="robots" content="noindex">
<meta property="og:title" content="Ans Ali Presents">
<meta property="og:image" content="unforsaken.webp">
</head>
<body>
<title>Ans Ali Presents</title>
<meta name="description" content="Seven original Islamic cinema concepts, and the work of AI filmmaker Ans Ali.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">
<style>
/* Layout: a streaming-service browse experience. Full-bleed billboard, horizontal rows, hover previews, title pages. */
:root{
  --bg:#0a0a0a;
  --bg2:#141414;
  --card:#181818;
  --ink:#ffffff;
  --soft:#d2d2d2;
  --muted:#9a9a9a;
  --faint:#5f5f5f;
  --red:#e50914;
  --red2:#b20710;
  --green:#46d369;
  --line:rgba(255,255,255,.12);
  --ui:"Manrope","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mark:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --pad:clamp(16px,4vw,60px);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.bglight{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(110% 60% at 50% -10%,rgba(255,255,255,.08),rgba(255,255,255,.02) 40%,transparent 70%),linear-gradient(180deg,#0e0e0e 0%,#0a0a0a 40%,#070707 100%)}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:4px}
::selection{background:var(--red);color:#fff}

/* ---------- intro ---------- */
.intro{position:fixed;inset:0;z-index:200;background:#000;display:grid;place-items:center;cursor:pointer;transition:opacity .6s ease,visibility .6s}
.intro.done{opacity:0;visibility:hidden}
.intro-mark{font-family:var(--mark);font-size:clamp(70px,16vw,220px);color:var(--red);letter-spacing:.02em;line-height:1;position:relative;
  text-shadow:0 0 40px rgba(229,9,20,.45);animation:mark 2.3s cubic-bezier(.6,0,.2,1) forwards}
.intro-mark::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.75) 48%,transparent 66%);mix-blend-mode:overlay;transform:translateX(-120%);animation:sheen 1.2s .5s ease forwards}
.intro-sub{position:absolute;bottom:22%;font-size:12px;letter-spacing:.5em;text-transform:uppercase;color:#bbb;animation:sub 2.3s ease forwards}
@keyframes mark{0%{transform:scale(1.9);opacity:0;filter:blur(18px);letter-spacing:.4em}30%{opacity:1;filter:blur(0);letter-spacing:.02em;transform:scale(1)}70%{transform:scale(1.04);opacity:1}100%{transform:scale(7);opacity:0;filter:blur(6px)}}
@keyframes sheen{to{transform:translateX(120%)}}
@keyframes sub{0%,20%{opacity:0}40%,70%{opacity:1}100%{opacity:0}}

/* ---------- nav ---------- */
.nav{position:fixed;left:0;right:0;top:0;z-index:60;padding:calc(env(safe-area-inset-top,0px) + 16px) var(--pad) 16px;display:flex;align-items:center;gap:clamp(16px,3vw,40px);
  background:linear-gradient(180deg,rgba(0,0,0,.75),transparent);transition:background .4s}
.nav.solid{background:rgba(10,10,10,.96)}
.logo{font-family:var(--mark);font-size:clamp(28px,3vw,36px);color:var(--red);letter-spacing:.03em;line-height:1;white-space:nowrap}
.links{display:flex;gap:clamp(12px,1.6vw,22px);font-size:14px}
.links a{color:#e5e5e5;transition:color .3s;white-space:nowrap}
.links a:hover{color:#b3b3b3}
.links a.on{color:#fff;font-weight:700}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:14px}
.avatar{width:34px;height:34px;border-radius:6px;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.cta-s{font-size:13.5px;font-weight:700;background:var(--red);padding:8px 14px;border-radius:4px;white-space:nowrap}
.cta-s:hover{background:var(--red2)}
@media (max-width:820px){.links .hm{display:none}}
@media (max-width:520px){.links{display:none}.cta-s{display:none}}

/* ---------- views ---------- */
main{transition:opacity .35s ease}
main.out{opacity:0}

/* billboard */
.bill{position:relative;margin-bottom:clamp(8px,2vw,24px)}
.bill-stage{position:relative;aspect-ratio:21/9;max-height:84vh;width:100%;overflow:hidden;background:#000}
.bill-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.08);transition:opacity 1.4s ease,transform 9s linear}
.bill-stage img.on{opacity:1;transform:scale(1)}
.bill-stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(10,10,10,.55) 0%,transparent 18%,transparent 72%,var(--bg) 100%)}
.bill-info{position:relative;z-index:2;padding:0 var(--pad);margin-top:clamp(-40px,-3vw,-12px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
@media (max-width:860px){.bill-info{grid-template-columns:1fr}}
.tagline{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:#e5e5e5}
.tagline b{font-family:var(--mark);font-weight:400;font-size:26px;letter-spacing:0;color:var(--red);line-height:1}
.bill h1{font-size:clamp(34px,4.6vw,64px);font-weight:800;letter-spacing:-.025em;line-height:1.02;margin:10px 0 12px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:15px;color:var(--soft)}
.meta .new{color:var(--green);font-weight:800}
.meta .box{border:1px solid rgba(255,255,255,.4);padding:0 6px;font-size:12px;border-radius:3px;line-height:1.6}
.syn{font-size:clamp(16px,1.35vw,19px);color:#e8e8e8;max-width:60ch;margin:14px 0 22px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:11px 26px;border-radius:5px;font-size:17px;font-weight:700;transition:background .2s,transform .2s}
.btn svg{width:22px;height:22px}
.btn-w{background:#fff;color:#000}
.btn-w:hover{background:rgba(255,255,255,.78)}
.btn-g{background:rgba(109,109,110,.7);color:#fff}
.btn-g:hover{background:rgba(109,109,110,.45)}
.bill-thumbs{display:flex;gap:8px;align-items:flex-end}
.bt{position:relative;width:96px;aspect-ratio:21/9;border-radius:4px;overflow:hidden;opacity:.45;transition:opacity .3s,transform .4s var(--ease);outline:2px solid transparent;outline-offset:2px}
.bt img{width:100%;height:100%;object-fit:cover}
.bt.on{opacity:1;outline-color:#fff}
.bt:hover{opacity:.9;transform:translateY(-3px)}
.bt i{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--red);transform:scaleX(0);transform-origin:0 50%}
.bt.on i{animation:prog 8s linear forwards}
.bill.paused .bt.on i{animation-play-state:paused}
@keyframes prog{to{transform:scaleX(1)}}
@media (max-width:860px){.bill-thumbs{overflow-x:auto;padding-bottom:4px}.bt{width:78px;flex:none}}
.bill-fade{animation:fadeup .9s var(--ease)}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* rows */
.row{position:relative;margin:clamp(26px,3.6vw,46px) 0}
.row-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:0 var(--pad);margin-bottom:12px}
.row-h h2{font-size:clamp(18px,1.6vw,23px);font-weight:800;margin:0;letter-spacing:-.01em}
.row-h .sub{font-size:13.5px;color:var(--muted)}
.row-h .more{font-size:13px;font-weight:700;color:#54b9c5;opacity:0;transform:translateX(-6px);transition:.4s var(--ease)}
.row:hover .row-h .more{opacity:1;transform:none}
.track{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 var(--pad);padding:6px var(--pad) 10px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.arrow{position:absolute;top:44px;bottom:12px;width:var(--pad);min-width:40px;z-index:5;display:grid;place-items:center;background:rgba(10,10,10,.55);opacity:0;transition:opacity .3s,background .3s}
.arrow svg{width:30px;height:30px;transition:transform .2s}
.arrow:hover{background:rgba(10,10,10,.8)}
.arrow:hover svg{transform:scale(1.25)}
.arrow.l{left:0}.arrow.r{right:0}
.row:hover .arrow{opacity:1}
@media (hover:none){.arrow{display:none}}

.tile{position:relative;flex:none;scroll-snap-align:start;border-radius:6px;overflow:hidden;background:var(--card);transition:transform .45s var(--ease),box-shadow .45s;cursor:pointer}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.tile.wide{width:clamp(280px,31vw,470px);aspect-ratio:21/9}
.tile.std{width:clamp(220px,21vw,320px);aspect-ratio:16/9}
.tile.big{width:clamp(280px,38vw,600px);aspect-ratio:16/9}
.tile .lbl{position:absolute;left:10px;bottom:8px;right:10px;font-size:13px;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.9);opacity:0;transition:opacity .3s}
.tile.cap .lbl{opacity:1}
.tile .flag{position:absolute;top:0;left:10px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.08em;padding:4px 7px 3px;border-radius:0 0 3px 3px;text-transform:uppercase}
.tile:hover img{transform:scale(1.04)}

/* reveal rows */
.rv{transition:opacity .9s var(--ease),transform 1s var(--ease)}
.rv.pre{opacity:0;transform:translateY(30px)}
.track .tile{transition:transform .45s var(--ease),opacity .7s var(--ease)}
.track.pre .tile{opacity:0;transform:translateX(40px)}

/* hover pop */
.pop{position:fixed;z-index:80;border-radius:8px;overflow:hidden;background:var(--card);box-shadow:0 18px 50px rgba(0,0,0,.75);
  transform-origin:50% 50%;opacity:0;transform:scale(.72);pointer-events:none;transition:opacity .28s ease,transform .38s var(--ease)}
.pop.on{opacity:1;transform:scale(1);pointer-events:auto}
.pop-img{position:relative;cursor:pointer}
.pop-img img{width:100%;height:100%;object-fit:cover}
.pop-body{padding:14px 16px 16px;display:grid;gap:10px}
.pop-ctl{display:flex;gap:8px;align-items:center}
.circ{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(255,255,255,.5);background:rgba(42,42,42,.6);transition:border-color .2s}
.circ:hover{border-color:#fff}
.circ svg{width:18px;height:18px}
.circ.w{background:#fff;border-color:#fff;color:#000}
.circ.w:hover{background:#e6e6e6}
.circ.end{margin-left:auto}
.pop h4{margin:0;font-size:15px;font-weight:800}
.pop .meta{font-size:13px;gap:8px}
.dots{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:#e5e5e5}
.dots span+span::before{content:"•";color:#646464;margin-right:6px}
.pop p{margin:0;font-size:13px;color:var(--soft);line-height:1.45}

/* bands */
.band{padding:clamp(48px,7vw,96px) var(--pad);border-top:1px solid rgba(255,255,255,.06)}
.band-h{display:grid;gap:10px;margin-bottom:28px;max-width:820px}
.kick{font-size:12px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--red)}
.band-h h2{font-size:clamp(28px,3.6vw,48px);font-weight:800;letter-spacing:-.025em;line-height:1.05;margin:0;text-wrap:balance}
.band-h p{margin:0;color:var(--soft);font-size:clamp(16px,1.3vw,18px);max-width:62ch}

.maker{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:clamp(24px,4vw,64px);align-items:center}
@media (max-width:860px){.maker{grid-template-columns:1fr}}
.maker-img{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:4/5;max-width:520px;width:100%}
.maker-img img{width:100%;height:100%;object-fit:cover}
.maker-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.65))}
.maker-img span{position:absolute;left:16px;bottom:14px;z-index:1;font-family:var(--mark);font-size:28px;letter-spacing:.04em}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:rgba(255,255,255,.08);border-radius:8px;overflow:hidden;margin-top:28px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--bg2);padding:20px 18px;display:grid;gap:4px;min-width:0}
.stat b{font-family:var(--mark);font-weight:400;font-size:clamp(40px,4.4vw,58px);line-height:.95;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);line-height:1.4}
.credits{display:grid;gap:10px;margin-top:22px;font-size:14.5px;color:var(--muted)}
.credits b{color:#fff;font-weight:600}

.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.g4{grid-template-columns:1fr}}
.panel{background:var(--bg2);border-radius:8px;padding:24px 22px;display:grid;gap:10px;align-content:start;min-width:0;border:1px solid rgba(255,255,255,.05)}
.panel .n{font-family:var(--mark);font-size:34px;color:var(--red);line-height:1}
.panel h3{margin:0;font-size:18px;font-weight:800}
.panel p{margin:0;color:var(--soft);font-size:14.5px}

.contact{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:end;background:linear-gradient(120deg,#1a0607 0%,#120a0a 40%,#0d0d0d 100%);border-radius:10px;padding:clamp(26px,5vw,64px);border:1px solid rgba(229,9,20,.18)}
@media (max-width:860px){.contact{grid-template-columns:1fr}}
.contact h2{margin:8px 0 10px;font-size:clamp(30px,4vw,54px);font-weight:800;letter-spacing:-.03em;line-height:1.02}
.contact p{margin:0;color:var(--soft);max-width:52ch}
.mail{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mail code{font-family:var(--ui);font-weight:700;font-size:17px;background:rgba(0,0,0,.4);padding:12px 16px;border-radius:5px;user-select:all;overflow-wrap:anywhere}
.foot{padding:40px var(--pad) calc(env(safe-area-inset-bottom,0px) + 40px);color:var(--faint);font-size:13px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}

/* ---------- title page ---------- */
.t-hero{position:relative;width:100%;aspect-ratio:21/9;max-height:86vh;overflow:hidden;background:#000}
.t-hero img{width:100%;height:100%;object-fit:cover;animation:heroin 1.6s var(--ease) both}
@keyframes heroin{from{transform:scale(1.12);filter:brightness(.4) blur(6px)}to{transform:scale(1);filter:none}}
.t-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,10,.5) 0%,transparent 16%,transparent 70%,var(--bg) 100%)}
.back{position:absolute;top:calc(env(safe-area-inset-top,0px) + 78px);left:var(--pad);z-index:3;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;background:rgba(0,0,0,.55);padding:8px 14px 8px 10px;border-radius:999px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.back:hover{background:rgba(0,0,0,.8)}
.t-info{padding:0 var(--pad);margin-top:clamp(-30px,-2vw,-8px);position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);animation:fadeup 1s .3s var(--ease) both}
@media (max-width:900px){.t-info{grid-template-columns:1fr}}
.t-info h1{font-size:clamp(38px,5.4vw,78px);font-weight:800;letter-spacing:-.035em;line-height:.98;margin:12px 0 14px}
.t-side{display:grid;gap:12px;font-size:14px;color:var(--muted);align-content:start;padding-top:8px}
.t-side b{color:#fff;font-weight:600}
.t-side .lg{font-size:15px;line-height:1.55}

.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:40;margin-top:clamp(32px,5vw,56px);background:rgba(10,10,10,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08)}
.tabs-in{display:flex;gap:clamp(18px,3vw,36px);padding:0 var(--pad);overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tabs button{position:relative;padding:16px 0 14px;font-size:15px;font-weight:700;color:var(--muted);white-space:nowrap;transition:color .3s}
.tabs button:hover{color:#fff}
.tabs button.on{color:#fff}
.tabs button::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--red);transform:scaleX(0);transition:transform .4s var(--ease)}
.tabs button.on::after{transform:scaleX(1)}
.sect{padding:clamp(40px,6vw,72px) var(--pad) 0;scroll-margin-top:130px}
.sect-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}
.sect-h h2{font-size:clamp(22px,2.2vw,30px);font-weight:800;margin:0;letter-spacing:-.02em}

/* episode list */
.eps{display:grid;border-top:1px solid #2a2a2a}
.ep{display:grid;grid-template-columns:40px minmax(130px,220px) minmax(0,1fr);gap:clamp(12px,2vw,24px);align-items:center;padding:clamp(16px,2vw,24px) clamp(8px,1.6vw,20px);border-bottom:1px solid #2a2a2a;border-radius:6px;transition:background .3s}
.ep:hover{background:#1f1f1f}
.ep .no{font-size:clamp(20px,2vw,26px);color:#d2d2d2;text-align:center;font-weight:500}
.ep-th{position:relative;aspect-ratio:16/9;border-radius:4px;overflow:hidden;background:#000}
.ep-th img{width:100%;height:100%;object-fit:cover;transform:scale(var(--z,1.8));object-position:var(--op,50% 50%);transition:transform .8s var(--ease)}
.ep:hover .ep-th img{transform:scale(calc(var(--z,1.8) + .12))}
.ep-th .play{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .3s;background:rgba(0,0,0,.25)}
.ep-th .play span{width:40px;height:40px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;background:rgba(0,0,0,.4)}
.ep:hover .ep-th .play{opacity:1}
.ep-b{display:grid;gap:6px;min-width:0}
.ep-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.ep-top h3{margin:0;font-size:16.5px;font-weight:800}
.ep-top span{font-size:14px;color:var(--soft);white-space:nowrap}
.ep-b p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5}
.ep-b .src{font-size:12.5px;color:#7d7d7d}
@media (max-width:640px){.ep{grid-template-columns:110px minmax(0,1fr)}.ep .no{display:none}}
.reveal{display:grid;gap:8px;margin-top:6px}
.beat{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;font-size:14px;color:var(--soft)}
.beat small{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#7d7d7d;padding-top:2px}
.beat.tw small{color:#e5b33d}.beat.rl small{color:var(--red)}
.sealed .val{filter:blur(6px);user-select:none;transition:filter .8s ease}
.unseal{justify-self:start;font-size:13px;font-weight:800;padding:7px 12px;border-radius:4px;background:rgba(255,255,255,.1);margin-top:4px}
.unseal:hover{background:rgba(255,255,255,.18)}
@media (max-width:520px){.beat{grid-template-columns:1fr;gap:2px}}
.door-box{margin-top:8px;padding:12px 14px;border-radius:6px;background:#1c1c1c;border:1px solid #2c2c2c;display:grid;gap:6px;font-size:14px}
.door-box .edge{color:#ff8a8a}
.door-box .dr .val{color:#fff}
.door-box q{font-style:italic;color:#e5e5e5;quotes:none}
.door-box cite{font-style:normal;font-size:12.5px;color:#e5b33d}
.select{position:relative}
.select select{appearance:none;-webkit-appearance:none;background:#242424;color:#fff;border:1px solid #4d4d4d;border-radius:4px;padding:10px 40px 10px 14px;font:700 15px var(--ui);cursor:pointer}
.select::after{content:"";position:absolute;right:15px;top:50%;width:8px;height:8px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-70%) rotate(45deg);pointer-events:none}

    prose:["Every time it seems nothing more can go wrong, something does. The audience should feel the horror and ask the question the film is really about: what would I do?","Then, at the very edge, with every exit shut, help arrives from the one direction nobody expected. Never magic. Always logical. Only at the end do we understand it was never chance.","The final image stays alive on screen. Over it, the ayah is heard in voiceover and its words appear. The film never preaches. The verse arrives as the answer to everything the audience has just felt."],
    why:[["Survival is universal","Trapped, buried, lost or forgotten. Every viewer understands the fear, with no background knowledge needed."],["Faith is the payoff","The verse is the reveal, not the premise, so it lands with the full weight of the story."],["Built for retention","Escalating jeopardy keeps viewers to the final minute, which is exactly where the message lives."]],
    verse:{ar:"وَمَن يَتَّقِ ٱللَّهَ يَجْعَل لَّهُۥ مَخْرَجًا وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ",en:"Whoever is mindful of Allah, He will make a way out for him, and provide for him from where he does not expect.",ref:"At-Talaq 65:2-3 · The spine of the series"},
    shape:true,
    laws:[["Historical, fictional people","No prophets or companions on screen."],["Act one plants a seed","One small act of goodness or faith that seems unimportant."],["Act two takes everything","The fall, then problem stacked on problem."],["Mercy in small doses","Just enough to survive to the next problem."],["The edge","The worst moment, with every exit closed."],["The door","Unexpected, but logical. Often the thing he feared, or the seed from act one."],["The verse ends it","A living final shot, the ayah in voiceover, its words on screen."]],
    doors:[
      {t:"The Well",era:"Arabia, 1100s",len:22,descent:"Betrayed by his partners and thrown into a dry well. His leg breaks. No water, a snake in the dark, a sandstorm burying the opening, and wolves circling the rim.",edge:"His voice is gone. The sand keeps falling.",door:"A flash flood. The water he thinks will drown him rises, and rises, and lifts him to the rim.",verse:"Indeed, with hardship comes ease.",ref:"Ash-Sharh 94:5-6"},
      {t:"The Grave",era:"Damascus, 1000s",len:24,descent:"A sudden sickness leaves him in a deathlike sleep. His family mourns him, washes him and buries him. He wakes in the dark beneath the earth, and the air is running out.",edge:"He stops clawing at the earth. He begins to pray.",door:"Grave robbers, digging that same night for his shroud and rings. The worst of men are the ones who pull him out.",verse:"Do not despair of relief from Allah.",ref:"Yusuf 12:87"},
      {t:"The Chain",era:"Mediterranean, 1500s",len:21,descent:"A fisherman captured at sea and chained to an oar as a galley slave. Whipped and starved for years. In battle, the ship burns and sinks with him locked to it.",edge:"The water closes over him, still chained.",door:"The oar breaks free and floats. The chain he cursed for years keeps him bound to it, unconscious, until the current carries him ashore.",verse:"And He will provide for him from where he does not expect.",ref:"At-Talaq 65:3"},
      {t:"The Snow",era:"Hindu Kush, 1300s",len:23,descent:"A messenger crossing the mountains in winter. His horse dies, an avalanche buries him alive, and frostbite takes his fingers. Above him, wolves are digging toward the scent of his horse.",edge:"He hears them coming closer through the snow.",door:"The wolves break through the crust above him. The predators he feared are what set him free.",verse:"Perhaps you dislike a thing and it is good for you.",ref:"Al-Baqarah 2:216"},
      {t:"The Siege",era:"Baghdad, 1258",len:25,descent:"A mother and her infant as the Mongols sack the city. She hides among the dead as fire spreads. The baby begins to cry, and a soldier walks the bodies, testing them with a spear.",edge:"The spear stops beside her.",door:"A Christian neighbor she once helped shelters her in a church. Historically, Christians who took refuge in a Baghdad church were spared. Her small kindness returns as her only door.",verse:"Unquestionably, the help of Allah is near.",ref:"Al-Baqarah 2:214"},
      {t:"The Dungeon",era:"Aleppo, 1130s",len:22,descent:"Imprisoned for a crime he did not commit and forgotten for years. His tunnel collapses, his cellmate dies beside him, and the guards stop bringing food.",edge:"He has stopped counting the days.",door:"The great earthquake of 1138 cracks the prison wall open.",verse:"Whoever is mindful of Allah and patient, Allah does not let the reward of those who do good be lost.",ref:"Yusuf 12:90"}
    ],
    anatomy:[["Ordinary life",3],["The fall",3],["The descent",8],["The edge",4],["The door",3],["The ayah",1]],
    palette:[["Pit","#0a0806"],["Earth","#3b2a1a"],["Sand light","#c9a46a"],["Dried blood","#6e1f17"],["Shaft","#f1e8d6"]],
    look:[["Camera","Tight and physical through the struggle. One wide frame at the edge, so the audience feels how alone he is."],["Light","Hard single sources: a shaft of sun, a lantern, moonlight on snow. Darkness is a character."],["Sound","Breath, heartbeat, wind and earth. The score is held back until the door opens."],["Ending","Never a black screen. The ayah plays over a living final shot, with its text on screen."]],
    rules:["No death and no afterlife endings. Every film ends in survival.","The rescue is physically plausible and quietly set up earlier in the film.","Every verse is quoted accurately, with surah and ayah on screen.","Injury and fear are felt, never exploited.","No prophets or companions on screen. Protagonists are fictional people in real eras.","Every script passes scholar review before production."]

  {
    id:"i-was-there", title:"I Was There", hidden:false, year:"2026", img:"i-was-there.webp", imgSm:"i-was-there-sm.webp",
    genre:"Cinematic Anthology", tags:["Epic","Sacred History","Spectacle"], moods:"Awe-inspiring, reverent, immersive", runtime:"10 to 14 min",
    logline:"Islamic history, narrated by the things that saw it happen.",
    synopsis:"The sea that parted. The fire that turned cool. The cave where the first word was revealed. Sacred moments told in first person by the witnesses that never left.",
    statement:"Some moments were too sacred to film, and too powerful to forget.",
    prose:["I Was There tells them through the only witnesses that never left: the sea, the fire, the stone, the cave. Each episode is narrated in the first person by an object or place that stood at the center of history.","We never show the prophets. We show what they saw, what they touched, and what changed forever after. The camera becomes the witness, and the audience stands exactly where history happened."],
    why:[["The rule becomes the style","Prophets are never depicted, so the format is built on point of view, absence and environment."],["Instantly recognizable","Audiences already know these stories. The new angle is what makes them stop scrolling."],["Spectacle at scale","Walls of water and colossal fires are exactly where AI filmmaking outperforms a traditional budget."]],
    episodes:[["I Am the Sea","The Red Sea, the night it was commanded to split for Musa and close on Pharaoh's army.","Ash-Shu'ara 26:63",12],["I Am the Fire","The fire built for Ibrahim, so vast that birds could not fly over it, and the moment it was told to be cool.","Al-Anbiya 21:69",13],["I Am the Whale","The darkness inside, the voice praying within it, and the shore where it was finally released.","As-Saffat 37:139-146",11],["I Am the Cave","Hira, on the night the first word was revealed: Iqra.","Al-Alaq 96:1-5",12],["I Am the Elephant","Mahmud, the lead elephant of Abraha's army, who knelt and refused to march on the Kaaba.","Al-Fil 105",12],["I Am the Stone","The Black Stone. Kissed by the Prophet ﷺ, stolen in 930, broken, and returned after twenty two years.","Historical record",14],["I Am the Chain","The great chain across Constantinople's harbor, the night Sultan Mehmed's ships were dragged over the hills around it.","Constantinople, 1453",13]],
    anatomy:[["Cold open",1],["The witness wakes",2],["The world before",3],["The moment",4],["The aftermath",1.5],["Verse and sources",0.5]],
    palette:[["Abyss","#0b1a24"],["Deep teal","#1f4a5c"],["Moonlight","#c9d6dc"],["Torch","#e08a3c"],["Void","#0a0a0c"]],
    look:[["Camera","Low, immersive angles from the witness's position. The lens sits where the object sits."],["Light","Practical sources only: moon, fire, torchlight."],["Sound","One intimate narrator voice against enormous natural sound."]],
    rules:["No prophet or companion is ever shown, voiced, or detailed in silhouette.","Every Quranic reference appears on screen with surah and ayah.","Narration is reviewed by a qualified scholar before production.","Where history is uncertain, the witness says so."]
  },
  {
    id:"stories-he-told", title:"Stories He Told", hidden:false, year:"2026", img:"stories-he-told.webp", imgSm:"stories-he-told-sm.webp",
    genre:"Short Film Anthology", tags:["Drama","Parables","Hadith"], moods:"Emotional, intimate, moving", runtime:"8 to 12 min",
    logline:"The parables the Prophet ﷺ told, brought to life as cinema.",
    synopsis:"Trapped men, desperate sinners, tested souls. Stories preserved for fourteen centuries in authentic hadith, filmed as full dramatic shorts for the first time.",
    statement:"The Prophet ﷺ was a storyteller, and almost none of his stories has ever been filmed.",
    prose:["He spoke of trapped men, desperate sinners, tested souls and impossible faith. These stories have been preserved for fourteen centuries in authentic hadith.","Stories He Told turns them into short films with full characters, dialogue and drama. The characters are ordinary people, so we can show their faces, their fear and their choices.","Every film closes on the hadith itself, so the audience knows exactly who first told it."],
    why:[["Untouched material","Some of the most dramatic stories in Islam have never been adapted. There is no competition on this shelf."],["Full drama is permitted","Ordinary people as characters means performance, faces and dialogue, without crossing any line."],["Teaches without preaching","The lesson arrives through the story. The hadith at the end lands as a revelation."]],
    episodes:[["The Boulder","Three men are trapped in a cave by a falling rock. Each prays by the one sincere deed of his life, and the stone moves a little with every prayer.","Sahih al-Bukhari, Sahih Muslim",10],["The Ninety-Nine","A man who has killed ninety-nine people walks across the land looking for a way back to God.","Sahih al-Bukhari, Sahih Muslim",11],["The Test","A leper, a bald man and a blind man are each given everything. Years later, a stranger comes asking for help.","Sahih al-Bukhari, Sahih Muslim",12],["The Boy and the King","A boy the king cannot kill, and the one way he tells the king it can be done.","Sahih Muslim",9],["Juraij","A devoted monk is falsely accused by an entire town, until an infant speaks to clear his name.","Sahih al-Bukhari, Sahih Muslim",10],["The Debt at Sea","A man borrows a fortune, cannot find a ship to repay it, and throws the money into the ocean sealed inside a piece of wood.","Sahih al-Bukhari",9]],
    anatomy:[["Cold open",1],["The ordinary life",2],["The trial",3.5],["The choice",2],["The resolution",1],["The hadith",0.5]],
    palette:[["Umber","#2a1608"],["Lamp","#7a4316"],["Amber","#d99a4e"],["Steel","#3b5566"],["Night","#0d0b0a"]],
    look:[["Camera","Intimate close-ups at the moment of choice. Wide, still frames for consequence."],["Light","Chiaroscuro. Oil lamps and slivers of daylight carving faces out of darkness."],["Sound","Performance first. A sparse score that enters only at the turn."]],
    rules:["Only parables from authentic collections, with the source on screen.","Story beats stay faithful to the narration. Invention is limited to setting, costume and supporting dialogue.","The closing hadith is given in translation with its reference.","Scholar review on every script."]
  },
  {
    id:"cold-case", title:"Cold Case: Ummah", hidden:false, year:"2026", img:"cold-case.webp", imgSm:"cold-case-sm.webp",
    genre:"Investigative Thriller", tags:["Mystery","True History","Thriller"], moods:"Suspenseful, cerebral, gripping", runtime:"18 to 24 min",
    logline:"The unsolved mysteries of the Muslim world, reopened.",
    synopsis:"A vanished fleet of 2,000 ships. A tomb opened days before a world war. A lost map of Columbus hidden inside an Ottoman one. Real cases, real twists, told like a thriller.",
    statement:"History is full of unanswered questions, and some of the greatest belong to the Muslim world.",
    prose:["Cold Case: Ummah reopens them one file at a time. Every episode moves like a thriller: a hook, the evidence, the turn, and a reveal that changes what you thought you knew.","Every twist comes from the real historical record. Nothing is invented, because the truth is already stranger than fiction."],
    why:[["A proven appetite","True crime and mystery are among the most watched documentary forms online."],["Twists that are real","Every reveal is drawn from the historical record, so it is both gripping and defensible."],["Years of supply","From Mali to Samarkand to Naples, there are centuries of open files."]],
    cases:[
      {t:"The Sultan Who Sailed West",id:"Mali, 1311",len:22,hook:"A king of Mali gives up his throne to find the end of the Atlantic.",turn:"His first fleet of 200 ships vanishes. A single captain returns, describing a river in the middle of the ocean that swallowed the rest.",twist:"The king does not stop. He sets out himself with 2,000 ships, and is never seen again.",reveal:"The only account of the voyage comes from the man who inherited his throne: Mansa Musa, the richest man in history. Was he telling the truth, or the story that made him king?",src:"Recorded by al-Umari from Mansa Musa's own account"},
      {t:"The Tomb of Timur",id:"Samarkand, 1941",len:20,hook:"June 1941. Soviet scientists open the tomb of Timur, despite warnings of a curse.",turn:"Within days, Germany invades the Soviet Union. Tens of millions will die.",twist:"Late in 1942, Timur is reburied with full Islamic rites. Within weeks, the tide turns at Stalingrad.",reveal:"The skeletons confirmed what legend had claimed for five centuries: Timur really was lame, and his grandson Ulugh Beg really had been beheaded on his own son's orders.",src:"Gerasimov expedition records. The curse is presented as legend"},
      {t:"The Admiral's Map",id:"Istanbul, 1929",len:21,hook:"Workers converting Topkapi Palace into a museum find a 400 year old map drawn on gazelle skin.",turn:"The world claims it shows Antarctica centuries before its discovery.",twist:"The real secret is in the admiral's notes. He built it from about twenty sources, including a map drawn by Christopher Columbus that has never been found.",reveal:"Its maker, Piri Reis, the greatest navigator of his empire, was later executed by that same empire, in his eighties.",src:"Piri Reis map, 1513, Topkapi Palace Library"},
      {t:"The Peacock Throne",id:"Delhi, 1739",len:19,hook:"Shah Jahan's throne took seven years to build and was worth more than the Taj Mahal.",turn:"In 1739 Nader Shah sacks Delhi and carries it away to Persia.",twist:"Eight years later Nader Shah is assassinated in his tent, and in the chaos the throne disappears.",reveal:"The throne later shown in Iran under the same name is a different throne. The original was most likely broken apart, and the Koh-i-Noor, taken in the same plunder, now sits in the British Crown Jewels.",src:"Mughal and Persian court chronicles"},
      {t:"The Prince Who Was Sold",id:"Naples, 1495",len:23,hook:"1481. An Ottoman prince loses a war for the throne to his brother and flees to Europe.",turn:"The Christian powers treat him as a weapon against the Ottomans. He becomes the Pope's most valuable prisoner.",twist:"His own brother, the Sultan, pays the Pope a fortune every year to keep him locked away.",reveal:"In 1495, in Naples, he dies suddenly at thirty five. The rumors point to poison, and to the Borgias.",src:"Ottoman and Vatican records of Cem Sultan"}
    ],
    anatomy:[["Hook",2],["Case file",4],["The turn",4],["The twist",5],["Final reveal",4],["Case status",1]],
    palette:[["Noir","#0a0a0a"],["Archive","#3b2a14"],["Lamp gold","#c89b52"],["Thread red","#b3261e"],["Paper","#e8e2d4"]],
    look:[["Camera","Top-down evidence tables, slow push-ins on documents, reconstructions as desaturated flashbacks."],["Light","Single tungsten pools against deep black."],["Sound","Ticking, paper, low synth pulses. Silence before every reveal."]],
    rules:["Every twist is sourced from the historical record, with the source on screen.","Legend is labeled as legend. A curse is never presented as fact.","Open questions stay open. We never invent a solution.","Fact-checked against primary and academic sources."]

    id:"bab-ul-islam", title:"Bab-ul-Islam", hidden:false, year:"2026", img:"bab-ul-islam.webp", imgSm:"bab-ul-islam-sm.webp",
    genre:"Historical Epic", tags:["History","South Asia","Epic"], moods:"Majestic, unflinching, moving", runtime:"15 to 20 min",
    logline:"How Islam entered South Asia, and the darkest chapters the Ummah has lived through.",
    synopsis:"Season one follows the light: the arrival of Islam through Sindh and the civilization it built. Season two follows the dark: the tragedies Muslims have lived through, told without softening.",
    statement:"Islam entered South Asia through Sindh, the land later called the Gate of Islam.",
    prose:["This is our history, told in two seasons. The Light follows the arrival of Islam and the civilization it built. The Dark follows the darkest chapters Muslims have lived through.","A people that forgets its tragedies repeats them. Bab-ul-Islam remembers both, so the audience understands what was built, what was lost, and why."],
    why:[["A story with a home","Almost everyone makes Arabia content. Almost nobody makes South Asia's Islamic history at this level."],["Range in one brand","Pride and wonder in one season, grief and reckoning in the next."],["Unseen by the world","Debal, Mansura and Makli are as cinematic as Rome, and almost unknown."]],
    seasonNames:["Season 1: The Light","Season 2: The Dark"],
    light:[["Debal, 711","Muhammad bin Qasim's fleet lands near what is now Karachi, and a new chapter of the subcontinent begins.","711 CE",18],["Mansura","The lost Arab capital of Sindh, rebuilt from its ruins at the height of its life.","8th to 11th century",17],["Makli","One of the largest necropolises on earth, reconstructed as it stood, with the dynasties beneath it.","14th to 18th century",16]],
    dark:[["The Year the Kaaba Bled","The Qarmatians attack Makkah during Hajj, kill pilgrims inside the Haram, throw bodies into Zamzam and carry away the Black Stone.","930 CE",19],["Delhi, 1739","Nader Shah orders a massacre, and tens of thousands die in a single day. Muslim against Muslim.","1739",18],["The Bloody Gate","After the revolt fails, the British hunt Delhi. The Mughal princes are shot at a gate still called the Khooni Darwaza.","1857",17],["The Last of Andalusia","The Moriscos, Muslims forced to convert, are expelled from Spain entirely. Eight centuries end.","1609",16],["The Trains of 1947","Partition, through the eyes of the passengers on the trains that arrived carrying the dead.","1947",20]],
    darkNote:"Karbala and 1971 belong among the darkest chapters, but given their sectarian and political weight, they enter the series only by mutual agreement.",
    anatomy:[["Cold open",1.5],["Context",4],["The event",7],["The aftermath",4],["Legacy",1.5]],
    palette:[["Honey","#e9c46a"],["Sandstone","#c4892f"],["Sea mist","#6b8f9e"],["Ash","#3a3a3c"],["Dried red","#7c1d1d"]],
    look:[["Camera","The Light: sweeping aerials and warm, wide compositions. The Dark: grounded and handheld."],["Light","Golden dawn for the Light. Smoke-filtered, desaturated daylight for the Dark."],["Sound","Regional instruments for the Light. Near silence for the Dark."]],
    rules:["Violence is implied, never graphic.","Every chapter rests on historians' sources, with competing accounts acknowledged.","No sectarian framing. Victims are honored, never used.","Sensitive chapters are reviewed with you before scripting."]

    genre:"Nature Documentary", tags:["Nature","Reflection","Quran"], moods:"Calm, beautiful, contemplative", runtime:"6 to 9 min",
    logline:"One verse. One wonder of creation. Filmed like the finest nature documentaries on earth.",

    why:[["The most shareable format","Short, beautiful and calm. Built to be shared, saved and replayed."],["Reflection over claims","We avoid the scientific miracle style. The verse invites looking, and the film looks."],["Evergreen","Nature does not date. Every episode keeps earning views for years."]],

    episodes:[["The Magician","A sorcerer in Pharaoh's court prepares for the contest of his life. By sunset he and his fellow magicians have believed, and Pharaoh promises to crucify them all.","Ta-Ha 20:70-73",15],["The Handler","The man who drove Abraha's lead elephant toward Makkah, and watched it kneel.","Al-Fil 105",13],["The Fire of Baghdad","A young Mongol soldier helps burn the greatest city on earth in 1258. Within decades, his own rulers embrace the faith he came to destroy.","Baghdad, 1258",16],["The Crusader","Jerusalem, 1187. A Crusader waits for Salahuddin's army, expecting the massacre his grandfather took part in during 1099. Instead, he receives mercy.","Jerusalem, 1099 and 1187",14]],

    look:[["Camera","Locked to the enemy's eye line. We see the believers only as he sees them, until he changes."],["Light","Harsh light on power. Warmer, softer light arrives with the turn."],["Sound","The empire is loud. Belief arrives in quiet."]],

function assumptionText(){ const b=BUD(); return `Rough production cost only, before creative fees. Assumes about ${b.draftTakes} seconds of 480p drafts and ${b.finalTakes} seconds of 1080p finals generated for every second used on screen, at PKR ${b.pkrPerUsd} to the dollar. Higgsfield: ${b.hfDraftCr} credits per draft second and ${b.hfFinalCr} per 1080p second, at USD ${b.hfUsdPerCredit} per credit. Pay-as-you-go: USD ${b.paygDraftUsd} per 480p second and USD ${b.paygFinalUsd} per 1080p second. Images, voice and music add about PKR ${(+b.otherPkrPerMin).toLocaleString("en-US")} per finished minute. Prices checked October 2026.`; }
function budgetTable(){
  const rs=concepts().map(c=>({c,k:epCost(c,useHF)})); const max=Math.max(1,...rs.map(r=>r.k.total));
  return `<div class="bud-table" id="budHome"><div class="bud-top"><p class="bud-note">${pricedWith()}</p>${hfSwitch()}</div>
  <div class="bt-wrap"><table class="btab"><thead><tr><th scope="col">Concept</th><th scope="col">Episode</th><th scope="col">Cost per episode</th><th scope="col" class="hide-s">Per finished minute</th></tr></thead><tbody>
  ${rs.map(r=>`<tr><td><a href="#${esc(r.c.id)}">${esc(r.c.title)}</a></td><td>${r.k.m} min</td><td><div class="bcell"><span class="bbar"><i style="width:${(r.k.total/max*100).toFixed(1)}%"></i></span><b>${pkr(r.k.total)}</b></div></td><td class="hide-s">${pkr(r.k.total/r.k.m)}</td></tr>`).join("")}
  </tbody></table></div></div>`;
}
function budgetBandHTML(){ if(!concepts().length) return ""; return `<section class="band" id="budget-band"><div class="band-h rv"><span class="kick">Budget</span><h2>What one episode costs.</h2><p>A rough production budget for one finished episode of each concept, generated with Seedance 2.5 at 1080p. Use the switch to see the cost with Higgsfield removed.</p></div><div class="rv">${budgetTable()}</div><p class="bud-fine rv">${assumptionText()}</p></section>`; }
function conceptBudgetCard(c){

    <dl class="bud-lines">
      <div><dt>Video generation, Seedance 2.5</dt><dd>${pkr(k.video)}</dd></div>
      <div><dt>Images, voice and music</dt><dd>${pkr(k.other)}</dd></div>
      <div><dt>AI video on screen</dt><dd>${Math.round(k.vs/60)} of ${k.m} min</dd></div>
      <div><dt>${useHF?"Without Higgsfield":"With Higgsfield"}</dt><dd>${pkr(o.total)}<em class="${useHF?"save":""}">${useHF?"saves ":"adds "}${pkr(d)}</em></dd></div>

function conceptBudgetHTML(c){ return `<section class="sect" id="budget"><div class="sect-h"><h2>Budget</h2><span style="color:var(--muted);font-size:14px">Rough cost of one episode</span></div><div class="rv">${conceptBudgetCard(c)}</div><p class="bud-fine rv">${assumptionText()}</p></section>`; }

function beyondBandHTML(){ return `<section class="band" id="beyond-band"><div class="band-h rv"><span class="kick">Beyond YouTube</span><h2>One production. Many screens.</h2><p>Every episode is made once and keeps working in several places. This is what the channel gains.</p></div>

    <div class="panel rv"><span class="n">02</span><h3>Brand-funded seasons</h3><p>The model vertical drama studios now use: a brand funds a season and is credited as presenter, while the channel keeps full ownership of the series. Production pays for itself.</p></div>

    <div class="panel rv"><span class="n">04</span><h3>Streaming and licensing</h3><p>Finished seasons can be licensed to Islamic and regional streaming platforms, and footage can be licensed to other creators.</p></div>
  </div>
  <h3 class="fest-h rv">Where we can enter</h3>${festList()}</section>`; }
function conceptBeyondHTML(c){ if(!(c.beyond||[]).length) return ""; return `<section class="sect" id="beyond"><div class="sect-h"><h2>Beyond YouTube</h2><span style="color:var(--muted);font-size:14px">Where this concept can also live</span></div><div class="g4b">${c.beyond.map((b,i)=>`<div class="panel rv"><span class="n">${String(i+1).padStart(2,"0")}</span><h3>${esc(b[0])}</h3><p>${esc(b[1])}</p></div>`).join("")}</div><h3 class="fest-h rv">Festivals to enter</h3>${festList()}</section>`; }
function langBtn(c){ if(!c.ur||!c.ur.synopsis) return ""; return `<button type="button" class="langbtn" data-lang><span class="en" lang="ur">اردو میں پڑھیں</span><span class="ur">Read in English</span></button>`; }
function applyLang(){ document.body.classList.toggle("lang-ur",lang==="ur"); }
function refreshBudget(){ const h=$("#budHome"); if(h) h.outerHTML=budgetTable(); $$("[data-budc]").forEach(el=>{ const c=byId(el.dataset.budc); if(c) el.outerHTML=conceptBudgetCard(c); }); }
function wireLang(){ applyLang(); }
function wireBudget(){
  if(globalWired) return; globalWired=true;
  document.addEventListener("click",e=>{
    if(e.target.closest("[data-hf]")){ useHF=!useHF; refreshBudget(); return; }
    if(e.target.closest("[data-lang]")){ lang=lang==="ur"?"en":"ur"; applyLang(); }
  });
}

}

}

function curveSVG(){
  const X=t=>40+t/22*920, Y=p=>330-p*2.9;
  const pts=[[0,8,"Ordinary life"],[2.8,10],[3.6,30,"The fall"],[5.6,44],[6.6,56],[7.3,49],[8.4,66],[9.1,59],[10.2,76],[10.9,69],[12.1,86],[12.8,80],[14,92],[16.2,100,"The edge"],[17.8,98],[18.4,96,"The door"],[19.6,30],[21,14,"The ayah"],[22,10]];
  const d=pts.map((p,i)=>`${i?"L":"M"}${X(p[0]).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join(" ");
  const bands=[[0,3,"ORDINARY"],[3,6,"FALL"],[6,14,"DESCENT"],[14,18,"EDGE"],[18,21,"DOOR"]];
  const lab=[[0,8,"Ordinary life",6,-14],[3.6,30,"The fall",8,4],[9,62,"Problem, then small mercy",-60,-26],[16.2,100,"The edge",-30,-14],[18.4,96,"The door",14,26],[21,14,"The ayah",-30,-16]];
  return `<svg class="curve chart" viewBox="0 0 1000 380" role="img" aria-label="Pressure climbs in steps of problem and small mercy to the edge, then drops sharply when the door opens">
    <defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e50914" stop-opacity=".3"/><stop offset="1" stop-color="#e50914" stop-opacity="0"/></linearGradient></defs>
    ${bands.map((b,i)=>i%2?"":`<rect class="bd" x="${X(b[0])}" y="20" width="${X(b[1])-X(b[0])}" height="${Y(0)-20}"/>`).join("")}
    ${[0,25,50,75,100].map(v=>`<line class="gl" x1="40" x2="960" y1="${Y(v)}" y2="${Y(v)}"/>`).join("")}
    ${bands.map(b=>`<text x="${X(b[0])+8}" y="${Y(0)+26}">${b[2]}</text>`).join("")}
    <text x="0" y="${Y(100)+4}">HIGH</text><text x="0" y="${Y(0)+4}">CALM</text>
    <path class="ar2" d="${d} L${X(22)} ${Y(0)} L${X(0)} ${Y(0)} Z" fill="url(#gr)"/>
    <path class="ln" d="${d}"/>
    ${pts.filter(p=>p[2]).map(p=>`<circle class="mk${p[2]==="The door"?" dr":""}" cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="6"/>`).join("")}
    ${lab.map(l=>`<text class="lb" x="${(X(l[0])+l[3]).toFixed(1)}" y="${(Y(l[1])+l[4]).toFixed(1)}">${l[2]}</text>`).join("")}
  </svg>`;
}

/* --- line helpers --- */
const L=t=>String(t||"").split("\n").map(s=>s.trim()).filter(Boolean);
const P=t=>L(t).map(l=>l.split("|").map(s=>s.trim()));
const paras=t=>String(t||"").split(/\n\s*\n/).map(s=>s.replace(/\s*\n\s*/g," ").trim()).filter(Boolean);
const J=a=>(a||[]).map(x=>Array.isArray(x)?x.join(" | "):x).join("\n");
function epLines(arr){ return (arr||[]).map(e=>[e[0],e[1],e[2]||"",e[3]||""].join(" | ")).join("\n"); }
function parseEps(t){ return P(t).map(p=>[p[0]||"",p[1]||"",p[2]||"",p[3]?+p[3]||p[3]:""]); }

function readImage(file,maxW){
  return new Promise((res,rej)=>{
    if(!file) return res(null);
    const fr=new FileReader();
    fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const k=Math.min(1,maxW/im.width); const cv=document.createElement("canvas"); cv.width=Math.round(im.width*k); cv.height=Math.round(im.height*k); cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height); let u=cv.toDataURL("image/webp",.82); if(!u.startsWith("data:image/webp")) u=cv.toDataURL("image/jpeg",.85); res(u); }; im.onerror=rej; im.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

function act(b){

    case "r-up": swap(SITE.rows,ri,ri-1); commit(); break;
    case "r-down": swap(SITE.rows,ri,ri+1); commit(); break;
    case "r-vis": SITE.rows[ri].hidden=!SITE.rows[ri].hidden; commit(SITE.rows[ri].hidden?"Row hidden":"Row visible"); break;
    case "r-del": confirmBtn(b,()=>{ SITE.rows.splice(ri,1); commit("Row deleted"); }); break;
    case "r-new": SITE.rows.push({id:slug("row",allIds()),title:"New row",sub:"",label:"Project",channel:"",credit:"Produced by",size:"std",genres:[],hidden:false,items:[]}); commit("Row added. Give it a title and add titles to it."); break;
    case "i-up": swap(SITE.rows[ri].items,ii,ii-1); commit(); break;

    case "i-del": confirmBtn(b,()=>{ SITE.rows[ri].items.splice(ii,1); commit("Title deleted"); }); break;

  }
}

  $$(".rv, .track, .chart").forEach(el=>{ if(el.getBoundingClientRect().top>innerHeight*.95){ el.classList.add("pre"); io.observe(el);} });
  $$(".track").forEach(t=>$$(".tile",t).forEach((ti,i)=>ti.style.transitionDelay=(i*60)+"ms"));
  $$(".curve .ln").forEach(p=>p.style.setProperty("--len",p.getTotalLength()));

  const loop=()=>{ clearInterval(t); if(!reduce&&imgs.length>1) t=setInterval(()=>{ if(!b.classList.contains("paused")) show((i+1)%imgs.length); },8000); };
  th.forEach((x,k)=>x.addEventListener("click",()=>{show(k);loop();}));
  b.addEventListener("pointerenter",()=>b.classList.add("paused")); b.addEventListener("pointerleave",()=>b.classList.remove("paused"));

  $$("[data-count]").forEach(e=>io.observe(e)); cleanup.push(()=>io.disconnect());
}

const nav=$("#nav");
addEventListener("scroll",()=>nav.classList.toggle("solid",scrollY>60),{passive:true});

/* intro (skipped for the manager) */
const intro=$("#intro"); let seen=false;
try{ seen=sessionStorage.getItem("introSeen")==="1"; }catch(e){}
if(seen||reduce||location.hash==="#manager"){ intro.classList.add("done"); }
else{ const end=()=>{ intro.classList.add("done"); try{sessionStorage.setItem("introSeen","1");}catch(e){} }; setTimeout(end,2300); intro.addEventListener("click",end); }

/* boot: published data.json, then this browser's draft */
async function boot(){
  try{ const r=await fetch("data.json",{cache:"no-store"}); if(r.ok){ const d=await r.json(); if(d&&d.concepts&&d.rows){ PUB=ensure(d); SITE=PUB; } } }catch(e){}
  loadDraft();
  addEventListener("hashchange",route);
  route();
}
boot();
})();
</script>
